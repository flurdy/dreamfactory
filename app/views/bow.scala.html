@(branded: Boolean = true)(implicit messages: Messages)

@if(branded){
   <header class="branded">
      <h1 class="sr-only">@Messages("application.flurdy.header")</h1>
      <a href="@routes.HomeController.index"><img src="@views.assetUrl("images/codeatflurdy.png")" alt="@Messages("application.flurdy.header")" /></a>
      <!-- <a href="@routes.HomeController.index"><img src="@views.assetUrl("images/flurdy.png")" alt="@Messages("application.flurdy.header")" /></a> -->
   </header>
} else {
   <header class="unbranded">
      <h1 class="sr-only">@Messages("application.header")</h1>
      <a href="@routes.HomeController.index"><img src="@views.assetUrl("images/dreamfactory.png")" alt="@Messages("application.header")" /></a>
   </header>
}
