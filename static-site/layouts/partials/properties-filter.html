{{ $filters := hugo.Data.projects.controls.properties }}
<details id="filter-section" class="surface filter-section" open>
  <summary>Properties Filter</summary>
  <div class="filter-section-body">
    <form id="catalog-filter-form" action="/projects/" method="get" class="properties-filter-form">
      <span id="catalog-filter-context" hidden></span>
      <div class="properties-filter-grid">
        {{ range $filters }}
          <fieldset class="property-filter">
            <legend><i class="{{ .icon }}" aria-hidden="true"></i><span>{{ .label }}</span></legend>
            <div class="property-filter-options">
              <input class="property-filter-input property-filter-any" type="radio" id="filter_{{ .name }}_any" name="filter.{{ .name }}" value="" checked>
              <label for="filter_{{ .name }}_any">Any</label>
              <input class="property-filter-input property-filter-include" type="radio" id="filter_{{ .name }}_include" name="filter.{{ .name }}" value="require">
              <label for="filter_{{ .name }}_include">Include</label>
              <input class="property-filter-input property-filter-exclude" type="radio" id="filter_{{ .name }}_exclude" name="filter.{{ .name }}" value="exclude">
              <label for="filter_{{ .name }}_exclude">Exclude</label>
            </div>
          </fieldset>
        {{ end }}
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" type="submit">Apply filters</button>
        <button class="btn btn-default" type="button" onclick="resetFilter(this.form)">Clear filters</button>
      </div>
    </form>
  </div>
</details>
